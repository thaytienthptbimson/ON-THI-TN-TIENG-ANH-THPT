function slugVi(s){
 return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'');
}

function openDocxModal(fromHome){
 const m=document.createElement('div');m.className='mask dmod';
 let picker='';
 if(fromHome||!last){
  let opts='';
  topics.forEach(t=>{for(let i=0;i<10;i++)opts+=`<option value="g:${t}:${i}">[Ngữ pháp] ${TN[t]} - Bài ${i+1}</option>`});
  PT.forEach((n,ty)=>{const b=pBank(ty);b.forEach((_,i)=>opts+=`<option value="p:${ty}:${i}">[Dạng bài] ${n} - Bài ${i+1}</option>`)});
  for(let i=0;i<20;i++)if(tEx(i).length)opts+=`<option value="t:${i}">[Đề mẫu] Đề mẫu ${i+1}</option>`;
  picker=`<label>Chọn đề thi / bài tập cần xuất</label><select id=dm_pick>${opts}</select>`;
 }
 const defCode=String(101+Math.floor(Math.random()*890)),defMin=(last&&last[3])||(last&&last[1]&&last[1].flatMap(s=>s.qs).length>=35?50:25);
 m.innerHTML=`<div><h3>📄 Xuất đề ra file Word (.docx)</h3><p class=sub>${fromHome||!last?'Chọn bài tập hoặc đề thi bất kỳ để xuất file Word chuẩn in ấn A4.':`Đang chọn: <b>${last[0]}</b>`}</p>${picker}<div class=r2><div><label>Chế độ đáp án</label><select id=dm_mode><option value=key>Đề + Bảng đáp án ở trang cuối</option><option value=exam>Chỉ xuất đề thi (không đáp án)</option><option value=mark>Tô đậm đáp án trên đề + Bảng đáp án</option></select></div><div><label>Nhãn câu hỏi</label><select id=dm_qlab><option value=Question>Question 1, 2... (Chuẩn đề Anh)</option><option value="Câu">Câu 1, 2... (Tiếng Việt)</option></select></div></div><div class=r2><div><label>Đơn vị / Trường (Góc trái)</label><input id=dm_org value="SỞ GIÁO DỤC VÀ ĐÀO TẠO"></div><div><label>Kỳ thi (Góc phải)</label><input id=dm_exam value="KỲ THI TỐT NGHIỆP THPT 2026 – 2027"></div></div><div class=r2><div><label>Mã đề thi</label><input id=dm_code value="${defCode}"></div><div><label>Thời gian làm bài (phút)</label><input id=dm_min type=number min=5 max=180 value="${defMin}"></div></div><div class=acts style="margin-top:16px;justify-content:flex-end"><button class="btn g" id=dm_no>Đóng</button><button class="btn doc" id=dm_ok>⬇ Tải file .DOCX</button></div></div>`;
 document.body.appendChild(m);
 $('#dm_no').onclick=()=>m.remove();
 m.onclick=e=>{if(e.target===m)m.remove()};
 $('#dm_ok').onclick=()=>{
  let title,secs,uAns={};
  if(fromHome||!last){
   const v=$('#dm_pick').value.split(':');
   if(v[0]==='g'){title=TN[v[1]]+', bài '+(+v[2]+1);secs=gEx(v[1],+v[2])}
   else if(v[0]==='p'){title=PT[+v[1]]+', bài '+(+v[2]+1);secs=pEx(+v[1],+v[2]).secs}
   else{title='Đề mẫu '+(+v[1]+1);secs=tEx(+v[1])}
  }else{
   [title,secs]=last;
   const all=secs.flatMap(s=>s.qs);
   all.forEach((q,idx)=>{const c=document.querySelector(`input[name=r${q.n}]:checked`);if(c)uAns[idx]=+c.value});
  }
  const code=$('#dm_code').value.trim()||'101';
  const blob=buildDocxBlob(title,secs,{
   org:$('#dm_org').value.trim()||'SỞ GIÁO DỤC VÀ ĐÀO TẠO',
   exam:$('#dm_exam').value.trim()||'KỲ THI TỐT NGHIỆP THPT 2026 – 2027',
   code,
   min:+$('#dm_min').value||25,
   mode:$('#dm_mode').value,
   qlab:$('#dm_qlab').value,
   uAns
  });
  const a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=`${slugVi(title)}_MaDe_${slugVi(code)}.docx`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  m.remove();toast('Đã xuất file Word (.docx) thành công!');
 };
}
